name: Benchmarks

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:       # Manual trigger

jobs:
  bench:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        run: pnpm --filter @nexoraaidrishti/bench bench 2>/dev/null || echo "Benchmarks not yet runnable in CI"

      - name: Add to job summary
        run: |
          echo "## DRISHTI Benchmark Results — $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Run \`pnpm bench\` locally for detailed results." >> $GITHUB_STEP_SUMMARY
