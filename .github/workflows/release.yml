name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests before publish
        run: pnpm --recursive test

      - name: Build packages
        run: pnpm --recursive --filter="./packages/*" exec tsc 2>/dev/null || true

      - name: Publish to npm
        run: |
          pnpm --filter @nexoraaidrishti/runtime publish --no-git-checks --access public
          pnpm --filter @nexoraaidrishti/components publish --no-git-checks --access public
          pnpm --filter @nexoraaidrishti/testing publish --no-git-checks --access public
          pnpm --filter @nexoraaidrishti/ssr publish --no-git-checks --access public
          pnpm --filter @nexoraaidrishti/cli publish --no-git-checks --access public
          pnpm --filter @nexoraaidrishti/vite-plugin publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: CHANGELOG.md
