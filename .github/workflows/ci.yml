name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --recursive exec tsc --noEmit 2>/dev/null || true

      - name: Run tests
        run: pnpm --recursive test

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          pnpm --recursive test 2>&1 | grep -E "Tests|Test Files" | while read line; do
            echo "- $line" >> $GITHUB_STEP_SUMMARY
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check formatting (non-blocking)
        run: |
          if command -v prettier &> /dev/null; then
            prettier --check "packages/*/src/**/*.ts" || echo "::warning::Formatting issues found"
          else
            echo "Prettier not configured — skipping"
          fi
        continue-on-error: true
